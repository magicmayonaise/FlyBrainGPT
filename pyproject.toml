[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybraingpt"
version = "0.1.0"
description = "Thirst-circuit RAG corpus builder over PMC Open Access JATS XML"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan Landayan" }]
dependencies = [
  "lxml>=5.0",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "requests>=2.31",
]

# PEP 735 dependency group: `uv sync` / `uv run` install it by default.
# Keep the ruff pin equal to the ruff-pre-commit `rev` in .pre-commit-config.yaml.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff==0.17.6",
  "pre-commit>=4.0",
  "mypy>=1.15",
  "pandas-stubs",
  "types-requests",
  "lxml-stubs",
]

[project.urls]
Repository = "https://github.com/magicmayonaise/FlyBrainGPT"

[tool.setuptools.packages.find]
where = ["."]
include = ["flybraingpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["flybraingpt", "scripts", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

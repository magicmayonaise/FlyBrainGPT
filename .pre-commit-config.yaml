# Pre-commit hooks: Python port of mattpocock/skills "setup-pre-commit".
#   Husky        -> pre-commit (git hook manager)
#   lint-staged  -> pre-commit runs hooks on staged files only
#   Prettier     -> ruff format (+ ruff check --fix)
#   typecheck    -> mypy
#   npm test     -> uv run pytest (on push)
#
# Install once per clone:   uv sync && uv run pre-commit install
# Run on everything:        uv run pre-commit run --all-files
# Bump hook versions:       uv run pre-commit autoupdate
#   (then set the matching ruff pin in pyproject.toml and run `uv lock`)

# `pre-commit install` sets up both the commit hook and the push hook.
default_install_hook_types: [pre-commit, pre-push]

# Committed corpus data and JATS fixtures must stay byte-for-byte unchanged,
# so the hooks that rewrite files skip them. Checks that only read files
# (large files, secrets) still cover them.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/|manifests/)
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/|manifests/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # On commit: scan only the staged changes (fast).
      - id: gitleaks
      # In CI: scan every commit in history.
      #   uv run pre-commit run gitleaks-history --hook-stage manual
      - id: gitleaks
        alias: gitleaks-history
        name: Detect hardcoded secrets (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
